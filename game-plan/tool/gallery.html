  {title:'8 snímků — oprava kola',status:'Zamítnuté',group:'rejected',badge:'rejected',note:'Další pokus o rotaci; velké kolo se mezi snímky deformovalo.',frames:eight('ride-eight-fixed/frames/'),link:root+'ride-eight-fixed/frames/'},
  {title:'8 snímků — čisté barvy',status:'Zamítnuté',group:'rejected',badge:'rejected',note:'Bez přidané stínové vrstvy, ale stále se objevil stínový šum.',frames:eight('ride-eight-clean/frames/'),link:root+'ride-eight-clean/frames/'},
  {title:'8 snímků — pevná paleta',status:'Zamítnuté',group:'rejected',badge:'rejected',note:'Omezená paleta zlepšila barvy, ale na zelené vznikaly mapy.',frames:eight('ride-eight-solid/frames/'),link:root+'ride-eight-solid/frames/'},
  {title:'První pokus o automatické barvení',status:'Starší pokus',group:'trial',badge:'older',note:'První rozdělení kresby na oblasti pro následné vybarvení.',frames:eight('coloring-test/frames/'),link:root+'coloring-test/'},
  {title:'Černobílý pokus v2',status:'Starší pokus',group:'trial',badge:'older',note:'Mezikrok při hledání čistých obrysů a průhledného pozadí.',frames:eight('coloring-test-v2/frames/','chuchvalec-ink-','.png'),link:root+'coloring-test-v2/'},
  {title:'Černobílý pokus v3',status:'Starší pokus',group:'trial',badge:'older',note:'Další varianta samostatných čar před finální sadou pro Cadmium.',frames:eight('coloring-test-v3/frames/','chuchvalec-ink-','.png'),link:root+'coloring-test-v3/'},
  {title:'Idle v2 — 24 snímků',status:'Zamítnuté',group:'rejected',badge:'rejected',note:'Příliš klidné dýchání; chyběl výraznější pohyb ruky, hlavy a profesora.',frames:[root+'idle-v2/chuchvalec-idle.webp'],link:root+'idle-v2/'},
  {title:'Jízda v3 — 120 snímků',status:'Zamítnuté',group:'rejected',badge:'rejected',note:'Zbytečně mnoho snímků a výsledek neodpovídal požadovanému stylu.',frames:[root+'ride-v3/chuchvalec-ride.webp'],link:root+'ride-v3/'},
  {title:'Samostatný lineart',status:'Starší pokus',group:'trial',badge:'older',note:'Jeden černobílý návrh před rozdělením do osmi samostatných PNG.',frames:[root+'lineart/chuchvalec-ink.png'],link:root+'lineart/'},
  {title:'Původní neutrální návrh',status:'Reference',group:'trial',badge:'reference',note:'Výchozí kresba postavy před dalšími animačními pokusy.',frames:[root+'chuchvalec-neutral@3x.png'],link:root+'chuchvalec-neutral@3x.png'}
 ];
 const zeroOffsets=()=>Array.from({length:8},()=>({x:0,y:0}));
 const storedOffsets=window.SPRITE_FRAME_OFFSETS||{};
 const storedOrders=window.SPRITE_FRAME_ORDERS||{};
 versions.forEach((item,index)=>{
  item.alignmentKey=item.alignmentKey||('legacy:'+(item.character||'chuchvalec')+':'+(item.link||index));
  item.frameOrder=[...(storedOrders[item.alignmentKey]||item.frameOrder||item.frames.map((_,i)=>i+1))];
  const originalFrames=[...item.frames];
  item.frames=item.frameOrder.map(source=>originalFrames[source-1]);
  const source=storedOffsets[item.alignmentKey]||item.frameOffsets||zeroOffsets();
  item.frameOffsets=zeroOffsets().map((fallback,frame)=>{
   const value=source[frame]||fallback;
   return {x:Number(value.x)||0,y:Number(value.y)||0};
  });
 });
 const character=document.getElementById('character');
 const knownCharacters=new Set([...character.options].map(option=>option.value));
 (window.SPRITE_VARIANTS||[]).forEach(item=>{
  if(knownCharacters.has(item.character))return;
  const option=document.createElement('option');option.value=item.character;option.textContent=item.displayName||item.character;character.append(option);knownCharacters.add(item.character);
 });
 const grid=document.getElementById('grid');
 const timers=new Map();
 const players=[];
 let allPlaying=true;
 function fitImage(img,host,offset,fixedHeight){
  if(!img.naturalWidth||!img.naturalHeight)return;
  const scale=fixedHeight
   ? fixedHeight/img.naturalHeight
   : Math.min(host.clientWidth/img.naturalWidth,host.clientHeight/img.naturalHeight);
  img.style.width=(img.naturalWidth*scale)+'px';
  img.style.height=(img.naturalHeight*scale)+'px';
  img.style.transform='translate('+(offset.x*scale)+'px,'+(offset.y*scale)+'px)';
 }
 function positionPlayer(player){
  const offset=player.item.frameOffsets[player.frame]||{x:0,y:0};
  fitImage(player.img,player.preview,offset,null);
  fitImage(player.scaleImg,player.gameScale,offset,player.gameHeight);
  if(player.positionLabel)player.positionLabel.textContent='x '+(offset.x>=0?'+':'')+offset.x+' · y '+(offset.y>=0?'+':'')+offset.y+' px';
 }
 function showFrame(player,frame){
  player.frame=(frame+player.item.frames.length)%player.item.frames.length;
  const source=player.item.frames[player.frame];
  player.img.src=source;player.scaleImg.src=source;
  player.counter.textContent=(player.frame+1)+' / '+player.item.frames.length;
  player.frameButtons.forEach((button,index)=>button.setAttribute('aria-pressed',String(index===player.frame)));
  if(player.orderLabel)player.orderLabel.textContent='Pořadí původních snímků: '+player.item.frameOrder.join(' · ');
  requestAnimationFrame(()=>positionPlayer(player));
 }
 function start(player){
  if(player.item.frames.length<2||timers.has(player.card))return;
  player.button.textContent='Pozastavit';player.button.classList.add('playing');
  const fps=Number(player.item.fps)||8;
  timers.set(player.card,setInterval(()=>showFrame(player,player.frame+1),1000/Math.max(1,Math.min(60,fps))));
 }
 function stop(player){
  if(!timers.has(player.card))return;clearInterval(timers.get(player.card));timers.delete(player.card);player.button.textContent='Přehrát';player.button.classList.remove('playing');
 }
 versions.forEach((item,index)=>{
  const card=document.createElement('article');card.className='card';card.dataset.group=item.group;card.dataset.character=item.character||'chuchvalec';
  const preview=document.createElement('div');preview.className='preview';
  const img=document.createElement('img');img.src=item.frames[0];img.alt=item.title;img.loading=index<6?'eager':'lazy';
  const counter=document.createElement('span');counter.className='counter';counter.textContent=item.frames.length>1?'1 / '+item.frames.length:'1 snímek';preview.append(img,counter);
  const gameScale=document.createElement('div');gameScale.className='game-scale';const scaleLabel=document.createElement('span');const gameHeight=item.gameHeight||160;scaleLabel.textContent='Herní měřítko · '+gameHeight+' pt';const scaleImg=document.createElement('img');scaleImg.src=item.frames[0];scaleImg.alt='';gameScale.append(scaleLabel,scaleImg);
  const info=document.createElement('div');info.className='info';
  const top=document.createElement('div');top.className='topline';
  const title=document.createElement('h2');title.textContent=item.title;
  const badge=document.createElement('span');badge.className='badge '+item.badge;badge.textContent=item.status;top.append(title,badge);
  const metrics=document.createElement('div');metrics.className='metrics';metrics.textContent='Rozměry se načítají…';
  const showMetrics=()=>{if(!img.naturalWidth||!img.naturalHeight)return;const ratio=img.naturalWidth/img.naturalHeight;const gameWidth=gameHeight*ratio;const fmt=value=>Number.isInteger(value)?String(value):value.toFixed(1).replace('.',',');const physicalWidth=Math.round(gameWidth*3);const physicalHeight=Math.round(gameHeight*3);const wrongSize=img.naturalWidth!==physicalWidth||img.naturalHeight!==physicalHeight;metrics.innerHTML='<strong>Herní:</strong> '+fmt(gameWidth)+' × '+fmt(gameHeight)+' pt<br><strong>Fyzicky @3×:</strong> '+physicalWidth+' × '+physicalHeight+' px<br><strong>Zdrojový snímek:</strong> '+img.naturalWidth+' × '+img.naturalHeight+' px'+(wrongSize?'<span class="warning">Zdroj neodpovídá cílové fyzické velikosti.</span>':'');};
  img.addEventListener('load',showMetrics,{once:true});if(img.complete)showMetrics();
  const note=document.createElement('p');note.textContent=item.note;
  const actions=document.createElement('div');actions.className='actions';
  let player=null;
  if(item.frames.length>1){
   const play=document.createElement('button');play.type='button';
   player={item,card,img,scaleImg,counter,button:play,frame:0,frameButtons:[],positionLabel:null,preview,gameScale,gameHeight};
   play.onclick=()=>{if(timers.has(card)){player.manualPaused=true;stop(player);}else{player.manualPaused=false;start(player);}};player.manualPaused=false;players.push(player);actions.append(play);
   const editor=document.createElement('div');editor.className='frame-editor';
   const editorTitle=document.createElement('h3');editorTitle.textContent='Poloha a pořadí snímků';
   const framePicker=document.createElement('div');framePicker.className='frame-picker';
   item.frames.forEach((_,frame)=>{const button=document.createElement('button');button.type='button';button.textContent=String(frame+1);button.setAttribute('aria-pressed',String(frame===0));button.onclick=()=>{player.manualPaused=true;stop(player);showFrame(player,frame);};player.frameButtons.push(button);framePicker.append(button);});
   const nudge=document.createElement('div');nudge.className='nudge';
   const position=document.createElement('div');position.className='position';player.positionLabel=position;
   [['up','↑',0,-1],['left','←',-1,0],['down','↓',0,1],['right','→',1,0]].forEach(([className,label,dx,dy])=>{const button=document.createElement('button');button.type='button';button.className=className;button.textContent=label;button.title='Kliknutí: 1 px, Shift + kliknutí: 3 px';button.onclick=event=>{player.manualPaused=true;stop(player);const step=event.shiftKey?3:1;const offset=item.frameOffsets[player.frame];offset.x+=dx*step;offset.y+=dy*step;positionPlayer(player);status.textContent='Neuložená změna';status.className='save-status';};nudge.append(button);});
   nudge.append(position);
   const positionTools=document.createElement('div');positionTools.className='position-tools';
   const reorder=document.createElement('div');reorder.className='reorder';reorder.setAttribute('role','group');reorder.setAttribute('aria-label','Přehazování aktuálního snímku');
   const reorderTitle=document.createElement('span');reorderTitle.textContent='Přehodit snímek';reorder.append(reorderTitle);
   [[-1,'← Dříve','Přesunout snímek doleva. První se prohodí s posledním.'],[1,'Později →','Přesunout snímek doprava. Poslední se prohodí s prvním.']].forEach(([direction,label,help])=>{
    const button=document.createElement('button');button.type='button';button.textContent=label;button.title=help;
    button.onclick=()=>{player.manualPaused=true;stop(player);const next=SpriteFrameEditing.moveFrame(item,player.frame,direction);showFrame(player,next);status.textContent='Neuložená změna pořadí';status.className='save-status';};reorder.append(button);
   });
   positionTools.append(nudge,reorder);
   const orderLabel=document.createElement('div');orderLabel.className='order-label';player.orderLabel=orderLabel;
   const editorActions=document.createElement('div');editorActions.className='editor-actions';
   const resetFrame=document.createElement('button');resetFrame.type='button';resetFrame.textContent='Nulovat snímek';resetFrame.onclick=()=>{player.manualPaused=true;stop(player);item.frameOffsets[player.frame]={x:0,y:0};positionPlayer(player);status.textContent='Neuložená změna';status.className='save-status';};
   const resetAll=document.createElement('button');resetAll.type='button';resetAll.textContent='Nulovat vše';resetAll.onclick=()=>{player.manualPaused=true;stop(player);item.frameOffsets=zeroOffsets();positionPlayer(player);status.textContent='Neuložená změna';status.className='save-status';};
   const save=document.createElement('button');save.type='button';save.className='save';save.textContent='Uložit polohy a pořadí';
   const status=document.createElement('div');status.className='save-status';
   if(location.protocol==='file:'){save.disabled=true;status.textContent='Posuny lze zkoušet. Ukládání funguje v lokálním editoru.';}
   save.onclick=async()=>{save.disabled=true;const snapshot=JSON.stringify({alignmentKey:item.alignmentKey,frames:item.frameOffsets,order:item.frameOrder});status.textContent='Ukládám…';status.className='save-status';try{const response=await fetch('/api/frame-offsets',{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Uložení se nezdařilo.');if(JSON.stringify(result.order)!==JSON.stringify(JSON.parse(snapshot).order))throw new Error('Server nepotvrdil pořadí. Je potřeba aktualizovat místní editor.');const changed=snapshot!==JSON.stringify({alignmentKey:item.alignmentKey,frames:item.frameOffsets,order:item.frameOrder});status.textContent=changed?'Uloženo; další změny zatím neuložené':'Polohy a pořadí uloženy';status.className=changed?'save-status':'save-status ok';}catch(error){status.textContent=error.message;status.className='save-status error';}finally{save.disabled=false;}};
   editorActions.append(resetFrame,resetAll,save);editor.append(editorTitle,framePicker,positionTools,orderLabel,editorActions,status);info.append(editor);
   img.addEventListener('load',()=>positionPlayer(player));scaleImg.addEventListener('load',()=>positionPlayer(player));
  }
  const open=document.createElement('a');open.href=item.link;open.textContent='Otevřít soubory';actions.append(open);
  info.prepend(top,metrics,note);info.append(actions);card.append(preview,gameScale,info);grid.append(card);if(player)showFrame(player,0);
 });
 const toggleAll=document.getElementById('toggleAll');
 toggleAll.onclick=()=>{allPlaying=!allPlaying;players.forEach(player=>{if(allPlaying&&!player.card.hidden){player.manualPaused=false;start(player);}else stop(player);});toggleAll.textContent=allPlaying?'Pozastavit vše':'Přehrát vše';};
 document.addEventListener('visibilitychange',()=>{if(document.hidden)players.forEach(stop);else applyFilters();});
 window.addEventListener('resize',()=>players.forEach(positionPlayer));
 let activeFilter='all';
 const requested=new URLSearchParams(location.search).get('postava');if(requested&&[...character.options].some(option=>option.value===requested))character.value=requested;
 function applyFilters(){document.querySelectorAll('.card').forEach(card=>card.hidden=card.dataset.character!==character.value||(activeFilter!=='all'&&card.dataset.group!==activeFilter));players.forEach(player=>{if(player.card.hidden)stop(player);else if(allPlaying&&!player.manualPaused)start(player);});}
 character.onchange=applyFilters;
 document.querySelectorAll('.filter').forEach(button=>button.onclick=()=>{activeFilter=button.dataset.filter;document.querySelectorAll('.filter').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));applyFilters();});
 applyFilters();
})();

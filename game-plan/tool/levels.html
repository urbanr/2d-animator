<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prdel světa — levely</title><script src="preview-bridge.js"></script>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101617;color:#e8ede5}*{box-sizing:border-box}body{margin:0}main{max-width:1480px;margin:auto;padding:32px 26px 54px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid #34403e;padding-bottom:22px;margin-bottom:22px}h1{font-size:clamp(34px,5vw,58px);margin:0;letter-spacing:-.05em}header p{color:#aebbb4;margin:7px 0 0}.back{color:#d4e5a1;text-decoration:none;border:1px solid #4b594a;border-radius:7px;padding:10px 14px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:#171f1f;border:1px solid #34403e;border-radius:10px;overflow:hidden}.card img{width:100%;aspect-ratio:1536/704;display:block;object-fit:cover;background:#262e2c}.info{padding:15px}.row{display:flex;justify-content:space-between;gap:14px}.row h2{font-size:19px;margin:0}.badge{border-radius:999px;padding:5px 8px;background:#588e8a;color:#eff;font-size:10px;font-weight:800;text-transform:uppercase}.info p{color:#aebbb4;line-height:1.5;font-size:13px;margin:9px 0}.meta{color:#bed084;font-size:11px}.actions{display:flex;gap:8px;margin-top:12px}.actions a{border:1px solid #465248;border-radius:6px;color:#e4eee2;text-decoration:none;padding:8px 11px;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}main{padding:23px 15px 40px}}
.level-preview{position:relative}.level-preview img{aspect-ratio:auto;height:auto}.walk-line{position:absolute;left:0;right:0;height:2px;background:#ffeb00;box-shadow:0 0 2px #000;pointer-events:none}.walk-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0;padding:12px 0;border-bottom:1px solid #34403e}.walk-controls>span:first-child{flex-basis:100%;font-size:13px;color:#ffeb00}.walk-controls button{min-width:42px;min-height:40px;border:1px solid #697147;border-radius:6px;background:#29312a;color:#fff;font-size:17px;cursor:pointer}.walk-controls button:hover{background:#434c33}.walk-status{font-size:12px;color:#c7d3bf}.actions{flex-wrap:wrap}
</style></head><body><main><header><div><h1>Levely</h1><p>Žlutá linka určuje úroveň chůze. ↑ / ↓ posouvá o 1 px, Shift o 10 px. Změny se ukládají automaticky. Nic se do hry nezvolí bez schválení.</p></div><nav><a class="back" href="poses.html">Pózy →</a> <a class="back" href="gallery.html">Postavy →</a></nav></header><section class="grid" id="grid"></section></main>
<script src="level-variants.generated.js"></script><script src="level-walk-editor.js"></script><script>
const grid=document.getElementById('grid');
const correctionsOnly=new URLSearchParams(location.search).get('verze')==='composition-v2';
if(correctionsOnly){const all=document.createElement('a');all.href='levels.html';all.textContent='Zobrazit i původní verze a ostatní levely';all.className='back';all.style.display='inline-block';all.style.marginBottom='20px';grid.before(all);}
(window.LEVEL_VARIANTS||[]).filter(item=>!correctionsOnly||item.variant==='composition-v2').forEach(item=>{
  const card=document.createElement('article');card.className='card';card.id=item.id+'-'+item.variant;
  const img=document.createElement('img');img.src=item.image;img.alt=item.title||item.name;img.loading='lazy';img.style.objectFit='contain';
  const preview=document.createElement('div');preview.className='level-preview';preview.append(img);
  const walkEditor=createWalkEditor(item,preview);
  const info=document.createElement('div');info.className='info';
  const row=document.createElement('div');row.className='row';
  const title=document.createElement('h2');title.textContent=item.title||item.name;
  const badge=document.createElement('span');badge.className='badge';badge.textContent=item.status;row.append(title,badge);
  const correction=document.createElement('p');correction.textContent=item.description||'';
  const note=document.createElement('p');note.textContent=item.mechanic;
  const meta=document.createElement('div');meta.className='meta';meta.textContent=item.size[0]+' × '+item.size[1]+' px · '+item.variant+' · třívrstvý plán';
  const actions=document.createElement('div');actions.className='actions';
  const master=document.createElement('a');master.href=item.image;master.textContent='Otevřít master';
  const source=document.createElement('a');source.href=item.source;source.textContent='Původní zdroj';actions.append(master,source);
  if(correctionsOnly){const compare=document.createElement('a');compare.href='levels.html#'+item.id+'-concept-v1';compare.textContent='Porovnat s původní';actions.append(compare);}
  info.append(row,walkEditor,correction,note,meta,actions);card.append(preview,info);grid.append(card);
});
if(location.hash){document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();}
</script></body></html>
